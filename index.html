<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SB Camping Trip</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SB Camping">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6ECE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121915" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<style>
:root{
  --bg:#E6ECE9; --surface:#F5F8F6; --surface2:#EEF2EF; --ink:#1E2B26; --muted:#5C6B64;
  --primary:#2F5D6E; --on-primary:#FFFFFF; --accent:#8F6531; --moss:#56684A; --stone:#A9B5AF;
  --line:#CBD5D0; --good:#2F5D6E; --warn:#8F6531; --shadow:0 1px 2px rgba(30,43,38,.08),0 6px 18px rgba(30,43,38,.07);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121915; --surface:#1A231F; --surface2:#222D28; --ink:#DCE5E0; --muted:#94A39C;
    --primary:#7FB0C2; --on-primary:#121915; --accent:#D6A866; --moss:#93A884; --stone:#4C5A53;
    --line:#2C3833; --good:#7FB0C2; --warn:#D6A866; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121915; --surface:#1A231F; --surface2:#222D28; --ink:#DCE5E0; --muted:#94A39C;
  --primary:#7FB0C2; --on-primary:#121915; --accent:#D6A866; --moss:#93A884; --stone:#4C5A53;
  --line:#2C3833; --good:#7FB0C2; --warn:#D6A866; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-weight:700;margin:0;letter-spacing:-.01em}
a{color:var(--primary)}
button{font:inherit;color:inherit}
.hidden{display:none!important}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.top h1{font-size:1.2rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:.78rem;color:var(--muted);background:var(--surface2);border-radius:999px;padding:4px 10px;white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.pill.err{color:var(--warn)}
.iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.iconbtn:active{background:var(--surface2)}
.iconbtn svg{width:24px;height:24px}

/* Layout */
main{max-width:680px;margin:0 auto;padding:14px 14px 120px}
.banner{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--muted);margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 6px}
.card-h h2{font-size:1.15rem}
.card-b{padding:6px 16px 14px}
.sub{color:var(--muted);font-size:.9rem}
.sect{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;font-size:1.05rem;margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:baseline}
.sect small{font-family:inherit;font-size:.85rem;color:var(--muted);font-weight:400}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}
.kv dt{color:var(--muted);font-weight:700}
.kv dd{margin:0;overflow-wrap:anywhere}

.row{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;cursor:pointer}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .n{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.row .time{flex:none;width:76px;color:var(--moss);font-weight:600;font-size:.9rem;padding-top:1px}
.row.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--stone)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.chip{font-size:.78rem;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.chip.open{color:var(--accent);border-color:var(--accent);background:transparent}
.chip.opt{color:var(--moss);border-color:var(--moss);background:transparent}

.chk{flex:none;width:30px;height:30px;margin:1px 0 0;border-radius:9px;border:2px solid var(--moss);background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.chk[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.chk svg{width:18px;height:18px;color:var(--on-primary);opacity:0}
.chk[aria-checked="true"] svg{opacity:1}
.chk:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,.seg button:focus-visible,.tabbar button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:44px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.warn{color:var(--warn);border-color:var(--warn);background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.addrow{display:flex;justify-content:center;padding:10px 16px 14px;border-top:1px solid var(--line)}
.linkbtn{border:0;background:none;color:var(--primary);font-weight:600;padding:8px 4px;cursor:pointer;min-height:40px}

.seg{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:var(--moss);border-radius:99px}

.bal{display:flex;justify-content:space-between;padding:10px 16px;border-top:1px solid var(--line)}
.bal:first-child{border-top:0}
.pos{color:var(--good);font-weight:600}
.neg{color:var(--warn);font-weight:600}

.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
.wxhours{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.wxh{flex:none;width:76px;scroll-snap-align:start;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.wxh .tm{font-size:.78rem;color:var(--muted);font-weight:600}
.wxh .tp{font-size:1.25rem;font-weight:700;margin:2px 0}
.wxh .sf{font-size:.72rem;color:var(--muted);line-height:1.25;height:2.5em;overflow:hidden}
.wxh .rn{font-size:.75rem;color:var(--primary);font-weight:600;margin-top:3px}
.wxday .hl{flex:none;text-align:right;font-weight:700;white-space:nowrap}
.wxday .hl span{color:var(--muted);font-weight:500}
.wxfoot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.wxfoot .sub{flex:1 1 100%}
.wxfoot .btn{flex:1}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.photo{border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);cursor:pointer;padding:0;text-align:left}
.photo img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.phwait{aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:10px;font-size:.82rem;color:var(--muted)}
.photo span{display:block;padding:6px 8px;font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar button{border:0;background:transparent;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--primary);font-weight:700}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(18,25,21,.45);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;
  max-height:90%;overflow:auto;padding:8px 16px calc(18px + env(safe-area-inset-bottom,0px));max-width:680px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:1.25rem;margin-bottom:10px}
.sheet h3{font-size:1.02rem;margin:18px 0 6px}
.field{margin-bottom:12px}
.field label,.lbl{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input[type=text],.field input[type=url],.field input[type=password],.field input[type=date],.field input[type=time],.field input[type=tel],.field input[type=number],.field select,.field textarea{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
.field textarea{min-height:90px;resize:vertical}
.pw{position:relative}
.pw input{padding-right:52px!important}
.pw .eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:transparent;color:var(--muted);border-radius:10px;display:grid;place-items:center;cursor:pointer;padding:0}
.pw .eye:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.pw .eye svg{width:22px;height:22px}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid var(--accent);outline-offset:0;border-color:transparent}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:44px;font-size:.95rem;color:var(--ink);font-weight:500;margin:0}
.opts input{width:20px;height:20px;accent-color:var(--primary)}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.note{font-size:.88rem;color:var(--muted);margin:6px 0 10px}
.alert{font-size:.9rem;color:var(--warn);margin:8px 0}
.sep{height:1px;background:var(--line);margin:16px 0}

/* Toast */
.toast{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:30;max-width:520px;margin:0 auto;
  background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow)}
.toast span{flex:1;font-size:.92rem}
.toast button{border:0;background:transparent;color:var(--bg);font-weight:700;min-height:40px;padding:0 12px;cursor:pointer;text-decoration:underline}

/* Gate screens */
.gate{max-width:460px;margin:0 auto;padding:28px 18px 60px}
.gate .mark{width:72px;height:72px;border-radius:18px;margin-bottom:16px}
.gate h1{font-size:1.8rem;margin-bottom:6px}
.gate p{color:var(--muted)}
.people{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.people button{min-height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem;cursor:pointer}
.people button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.log{font-size:.88rem}
.log .row{min-height:0;padding:9px 16px}
</style>
</head>

/* ---------- Formatting ---------- */
function fmtTime(t) {

  if (PREFS.h24) return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  const ap = h >= 12 ? 'PM' : 'AM'; const hh = h % 12 || 12;
  return hh + ':' + String(m).padStart(2, '0') + ' ' + ap;
}
function fmtStamp(ms) {

  const today = new Date(); const same = d.toDateString() === today.toDateString();
  return same ? t : d.toLocaleDateString(undefined, {month:'short', day:'numeric'}) + ', ' + t;
}
function parseDay(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

  if (!t.start) return out;
  const a = parseDay(t.start), b = t.end ? parseDay(t.end) : a;
  for (let d = new Date(a); d <= b && out.length < 14; d.setDate(d.getDate() + 1)) out.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'));

}

/* ---------- Mutations, activity, undo ---------- */

function mutate(text, fn, undoLabel) {

  fn();
  addAct(text);
  pruneAct(S);
  editSeq++;
  persist(text);
  render();
  if (undoLabel !== false) showUndo(undoLabel || cap(text), before);
}

function restore(before) {
  COLS.forEach(c => {
    if (c === 'act') return;
    const B = before.col[c] || {}, C = S.col[c] || {};
    new Set(Object.keys(B).concat(Object.keys(C))).forEach(id => {
      const b = B[id], cu = C[id];
      if (JSON.stringify(b) === JSON.stringify(cu)) return;
      if (b) C[id] = Object.assign(clone(b), {u:now(), by:me()});

}

/* ---------- Persistence + sync ---------- */
function persist(msg) {
  if (MODE === 'cloud') {
    store.set('cache', {state:S, sha:SHA});
    store.set('dirty', true);
    const msgs = store.get('msgs', []); msgs.push(pname(me()) + ' ' + msg); store.set('msgs', msgs.slice(-12));
    schedulePush();
  } else {
    if (!store.set('local', S)) note('This phone is out of storage. Remove a photo or two.');
  }
  updatePill();
}
let pushT = null;
function schedulePush() { clearTimeout(pushT); pushT = setTimeout(() => sync('edit'), 700); }
function estSize(s) { return Math.ceil(JSON.stringify(s).length * 4 / 3) + 400; }

async function sync(reason) {
  if (MODE !== 'cloud' || !CFG || !CFG.token || syncState.locked) return;
  if (syncState.busy) { syncState.again = true; return; }
  if (typeof navigator !== 'undefined' && navigator.onLine === false) { syncState.offline = true; updatePill(); return; }
  syncState.busy = true; syncState.err = ''; updatePill();
  try {
    for (let attempt = 0; attempt < 6; attempt++) {
      const seq = editSeq;
      const f = await ghRead('trip.json', CFG.token);
      let remote = null;
      if (f) {
        if (f.sha === SHA && !store.get('dirty', false) && !syncState.force) { break; }
        try { remote = upgrade(await decryptObj(JSON.parse(f.text), CFG.pass)); }
        catch (e) { lock(); return; }
      }
      const dirty = store.get('dirty', false) || syncState.force;
      const merged = remote ? merge(remote, S) : upgrade(clone(S));
      if (!dirty || (remote && sameData(merged, remote) && !syncState.force)) {
        S = editSeq === seq ? merged : merge(merged, S);
        SHA = f ? f.sha : SHA;
        if (editSeq === seq) { store.set('dirty', false); store.set('msgs', []); }
        store.set('cache', {state:S, sha:SHA});
        render();
        break;
      }
      const env = JSON.stringify(await encryptObj(merged, CFG.pass));
      if (env.length > LIMIT) { syncState.err = 'Trip data is over 900 KB. Remove a photo or two to sync.'; break; }
      const msgs = store.get('msgs', []);
      const msg = (msgs.length ? msgs.join('; ') : pname(me()) + ' updated the trip').slice(0, 240);
      try {
        SHA = await ghWrite('trip.json', env, f ? f.sha : null, msg, CFG.token);
      } catch (e) {
        if (e.status === 409 || e.status === 422) continue;
        throw e;
      }
      syncState.force = false;
      if (editSeq === seq) { S = merged; store.set('dirty', false); store.set('msgs', []); }
      else { S = merge(merged, S); }
      store.set('cache', {state:S, sha:SHA});
      render();
      if (editSeq !== seq) syncState.again = true;
      break;
    }
    await uploadPending();
    await purgeDeletedPhotos();
    syncState.last = now(); store.set('lastsync', syncState.last); syncState.offline = false;
  } catch (e) {
    if (e.status === 401 || e.status === 403) syncState.err = 'GitHub refused the token. Update it in Settings.';
    else if (e.status) syncState.err = 'GitHub error ' + e.status + '.';
    else { syncState.offline = true; }
  } finally {
    syncState.busy = false; updatePill();
    if (syncState.again) { syncState.again = false; setTimeout(() => sync('again'), 300); }
  }
}
function pillText() {
  if (MODE === 'artifact') return 'Preview with sample data';
  if (MODE === 'local') return 'Saved on this phone only';
  if (syncState.locked) return 'Passcode needed';
  const dirty = store.get('dirty', false);
  if (syncState.busy) return 'Syncing';
  if (syncState.err) return 'Not synced';
  if (syncState.offline) return (dirty || pendingCount) ? 'Offline, changes waiting' : 'Offline';
  if (dirty || pendingCount) return pendingCount ? pendingCount + (pendingCount === 1 ? ' photo' : ' photos') + ' waiting to upload' : 'Changes waiting';
  return syncState.last ? 'Synced ' + fmtStamp(syncState.last) : 'Not synced yet';
}
function updatePill() { const p = $('#pill'); if (p) { p.textContent = pillText(); p.classList.toggle('err', !!syncState.err || syncState.locked); } const s = $('#syncLine'); if (s) s.textContent = syncLine(); }
function syncLine() {

  let t = pillText() + '.';
  if (syncState.err) t += ' ' + syncState.err;

}

  try {
    const a = await ghRead('access.json', null);

    const f = await ghRead('trip.json', acc.token);

async function doSetup() {

  if (!gatePick) return showErr('Pick your name.');
  busyBtn('#gGo', true);
  try {
    const a = await ghRead('access.json', tok);

    const f = await ghRead('trip.json', tok);

/* ---------- Weather: National Weather Service forecast for the campsite ---------- */
const WX = {lat:34.54, lon:-119.80, place:'Paradise Rd (camp)', station:'https://www.wunderground.com/dashboard/pws/KCASANTA2033'};
const WX_FRESH = 30 * 60 * 1000;
let WXDATA = store.get('wx', null);          // {at, updated, periods:[...], hours:[...]}
let WXVIEW = store.get('wxview', '3');
let wxState = {busy:false, err:''};
async function wxJson(url) {
  const r = await fetch(url, {cache:'no-store', headers:{'Accept':'application/geo+json'}});
  if (!r.ok) throw httpErr(r.status, 'NWS ' + r.status);
  return r.json();
}
async function loadWeather(force) {
  if (wxState.busy || MODE === 'artifact') return;
  if (!force && WXDATA && now() - WXDATA.at < WX_FRESH) return;
  if (navigator.onLine === false) { wxState.err = 'offline'; paintWeather(); return; }
  wxState.busy = true; wxState.err = ''; paintWeather();
  try {
    let pt = store.get('wxpoint', null);
    if (!pt) { const j = await wxJson('https://api.weather.gov/points/' + WX.lat + ',' + WX.lon); pt = {f:j.properties.forecast, h:j.properties.forecastHourly}; store.set('wxpoint', pt); }
    const [f, h] = await Promise.all([wxJson(pt.f), wxJson(pt.h)]);
    const pick = p => ({name:p.name, start:p.startTime, day:p.isDaytime, t:p.temperature, rain:(p.probabilityOfPrecipitation && p.probabilityOfPrecipitation.value) || 0, wind:((p.windSpeed || '') + ' ' + (p.windDirection || '')).trim(), short:p.shortForecast, detail:p.detailedForecast || ''});
    WXDATA = {at:now(), updated:f.properties.updateTime || f.properties.generatedAt || '', periods:f.properties.periods.slice(0, 14).map(pick), hours:h.properties.periods.slice(0, 24).map(pick)};
    store.set('wx', WXDATA);
  } catch (e) { wxState.err = e.status ? 'unavailable' : 'offline'; if (e.status === 404) store.del('wxpoint'); }
  wxState.busy = false; paintWeather();
}
function wxDays(n) {
  const by = {}, order = [];
  (WXDATA.periods || []).forEach(p => { const d = p.start.slice(0, 10); if (!by[d]) { by[d] = {}; order.push(d); } by[d][p.day ? 'day' : 'night'] = p; });
  return order.slice(0, n).map(d => ({date:d, day:by[d].day, night:by[d].night}));
}
function wxDayName(d) { const t = new Date(); const today = t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); return d === today ? 'Today' : dayShort(d); }
function weatherBody() {
  if (MODE === 'artifact') return '<div class="card-b"><p class="note">The live forecast shows on the real site. This preview cannot reach the weather service.</p></div>';
  if (!WXDATA) return '<div class="card-b"><p class="note">' + (wxState.busy ? 'Loading the forecast.' : wxState.err === 'offline' ? 'No signal. The forecast loads the next time this phone is online.' : 'The forecast is not available right now. Try Refresh in a few minutes.') + '</p></div>';
  if (WXVIEW === '1') {
    const first = WXDATA.periods[0];
    return '<div class="wxhours" role="list" aria-label="Next 24 hours">' + WXDATA.hours.map(h => '<div class="wxh" role="listitem"><div class="tm">' + esc(fmtTime(h.start.slice(11, 16)).replace(':00', '')) + '</div><div class="tp">' + h.t + '°</div><div class="sf">' + esc(h.short) + '</div><div class="rn">' + (h.rain ? h.rain + '% rain' : '&nbsp;') + '</div></div>').join('') + '</div>' +
      (first ? '<div class="card-b" style="padding-top:0"><p class="n" style="margin:0"><strong>' + esc(first.name) + ':</strong> ' + esc(first.detail) + '</p></div>' : '');
  }
  return wxDays(Number(WXVIEW)).map(x => {
    const d = x.day || x.night, hi = x.day ? x.day.t : null, lo = x.night ? x.night.t : null;
    const rain = Math.max(x.day ? x.day.rain : 0, x.night ? x.night.rain : 0);
    return '<div class="row wxday"><div class="main"><div class="t">' + esc(wxDayName(x.date)) + '</div><div class="n">' + esc(d.short) + (rain ? '. ' + rain + '% chance of rain' : '') + (d.wind ? '. Wind ' + esc(d.wind) : '') + '</div></div>' +
      '<div class="hl">' + (hi != null ? hi + '°' : '') + (lo != null ? ' <span>' + lo + '°</span>' : '') + '</div></div>';
  }).join('');
}

/* Money */
function balances() {
  const net = {}; PORDER.forEach(p => net[p] = 0);
  live('exp').forEach(e => {
    const split = (e.split && e.split.length ? e.split : PORDER).filter(p => p in net);
    if (!split.length || !(e.paid in net)) return;
    const c = Math.round(e.cents || 0), base = Math.floor(c / split.length); let rem = c - base * split.length;
    net[e.paid] += c;
    split.forEach(p => { net[p] -= base + (rem > 0 ? 1 : 0); if (rem > 0) rem--; });
  });
  const cred = PORDER.filter(p => net[p] > 0).map(p => [p, net[p]]).sort((a, b) => b[1] - a[1]);
  const debt = PORDER.filter(p => net[p] < 0).map(p => [p, -net[p]]).sort((a, b) => b[1] - a[1]);
  const pays = []; let i = 0, j = 0;
  while (i < debt.length && j < cred.length) { const x = Math.min(debt[i][1], cred[j][1]); if (x > 0) pays.push([debt[i][0], cred[j][0], x]); debt[i][1] -= x; cred[j][1] -= x; if (debt[i][1] === 0) i++; if (cred[j][1] === 0) j++; }
  return {net, pays};
}
function viewMoney() {
  const ex = live('exp').sort((a, b) => (b.date || '').localeCompare(a.date || '') || b.u - a.u);
  const total = ex.reduce((s, e) => s + (e.cents || 0), 0);
  const {net, pays} = balances();
  return '<section class="card"><div class="card-h"><h2>Who owes whom</h2><span class="sub">Total ' + money(total) + '</span></div><div class="card-b" style="padding:0">' +
    (pays.length ? pays.map(p => '<div class="bal"><span>' + esc(pname(p[0])) + ' pays ' + esc(pname(p[1])) + '</span><strong>' + money(p[2]) + '</strong></div>').join('') : '<div class="bal"><span class="sub">Everyone is square.</span></div>') +
    '</div></section><section class="card"><div class="card-h"><h2>Balances</h2></div><div class="card-b" style="padding:0">' +

function loadImg(file) { return new Promise((res, rej) => { const url = URL.createObjectURL(file); const im = new Image(); im.onload = () => { res(im); }; im.onerror = () => rej(new Error('bad image')); im.src = url; }); }

    d = scaled(im, max, q); if (d.length * 4 / 3 + 400 < ENV_MAX) return d;

    try { const im = await loadImg(file); const img = makeFull(im), thumb = scaled(im, THUMB_MAX, 0.72); const id = uid(); await IDB.put('pending', id, {img, thumb}); FULL[id] = img; THUMB[id] = thumb; added.push(id); }
    catch (err) { bad++; }
  }
  if (added.length) {
    if (MODE !== 'cloud') { for (const id of added) { await IDB.put('img', id, FULL[id]); await IDB.put('img', id + '#t', THUMB[id]); await IDB.del('pending', id); } }

}

        const f = await ghRead(path, CFG.token); if (!f) continue;
        let img = await IDB.get('img', key);
        if (!img) { img = (await decryptObj(JSON.parse(f.text), old)).img; await IDB.put('img', key, img); }
        await ghWrite(path, JSON.stringify(await encryptObj({img}, a)), f.sha, pname(me()) + ' changed the passcode', CFG.token);
      }
    }
    await ghWrite('access.json', JSON.stringify(await encryptObj({token:CFG.token, by:me(), at:now()}, a)), acc ? acc.sha : null, pname(me()) + ' changed the passcode', CFG.token);
    closeSheet(); note('Passcode changed. Send the new one to the crew in a separate message from the link.');
  } catch (e) { busyBtn('#sPass', false); sErr('#pErr', e.message || 'Could not change the passcode.'); }
}
async function syncForced(oldPass) {
  // trip.json must be decrypted with the old passcode and re-encrypted with the new one
  for (let i = 0; i < 6; i++) {
    const f = await ghRead('trip.json', CFG.token);
    let merged = S;
    if (f) { const remote = upgrade(await decryptObj(JSON.parse(f.text), oldPass)); merged = merge(remote, S); }
    const env = JSON.stringify(await encryptObj(merged, CFG.pass));
    try { SHA = await ghWrite('trip.json', env, f ? f.sha : null, pname(me()) + ' changed the passcode', CFG.token); S = merged; store.set('cache', {state:S, sha:SHA}); store.set('dirty', false); store.set('msgs', []); syncState.force = false; syncState.err = ''; syncState.last = now(); store.set('lastsync', syncState.last); render(); return; }
    catch (e) { if (e.status === 409 || e.status === 422) continue; throw e; }
  }
  throw new Error('Could not save after several tries. Try again.');
}
async function updateToken() {
  const tok = $('#f_ntok').value.trim(); if (!tok) return sErr('#tErr', 'Paste the new token.');
  sErr('#tErr', ''); busyBtn('#sTok', true);
  try {
    const f = await ghRead('trip.json', tok); if (!f) throw new Error('The new token cannot see trip.json.');
    const acc = await ghRead('access.json', tok);
    await ghWrite('access.json', JSON.stringify(await encryptObj({token:tok, by:me(), at:now()}, CFG.pass)), acc ? acc.sha : null, pname(me()) + ' updated the token', tok);
    CFG.token = tok; store.set('cfg', CFG); syncState.err = ''; closeSheet(); note('Token updated. Other phones pick it up the next time they join.'); sync('token');
  } catch (e) { busyBtn('#sTok', false); sErr('#tErr', e.status === 401 || e.status === 403 ? 'GitHub refused that token.' : (e.message || 'Could not update the token.')); }
}
async function uploadIcon(e) {
  const file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return;
  const m = $('#iconMsg'); m.classList.remove('hidden'); m.textContent = 'Uploading icon.';
  try {
    const im = await loadImg(file); const s = Math.min(im.naturalWidth, im.naturalHeight);
    const out = {};
    [180, 192, 32].forEach(n => { const c = document.createElement('canvas'); c.width = c.height = n; const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, n, n); out[n] = c.toDataURL('image/png').split(',')[1]; });
    for (const n of [180, 192, 32]) { const path = 'icon-' + n + '.png'; const cur = await ghRead(path, CFG.token, true); await ghWriteB64(path, out[n], cur ? cur.sha : null, pname(me()) + ' replaced the app icon', CFG.token); }
    m.textContent = 'Icon uploaded. It shows after the Pages site updates and the app is re-added to the home screen.';
  } catch (err) { m.textContent = 'Icon upload failed' + (err.status ? ' (GitHub ' + err.status + ').' : '.'); }
}

/* ---------- Boot ---------- */
function boot() {
  refreshPending();
  if (MODE === 'cloud') {
    window.addEventListener('focus', () => sync('focus'));
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync('visible'); });
    window.addEventListener('online', () => { syncState.offline = false; sync('online'); if (TAB === 'trip') loadWeather(false); });
    window.addEventListener('offline', () => { syncState.offline = true; updatePill(); });
    if (CFG && CFG.token && CFG.pass) {
      const c = store.get('cache', null);
      if (c && c.state) { S = upgrade(c.state); SHA = c.sha; startCloud(); }
      else { S = emptyState(); startCloud(); }
    } else renderGate('join');
  } else {
    S = upgrade(store.get('local', null) || (SEED ? clone(SEED) : emptyState()));
    if (MODE === 'artifact' && !store.get('me', null)) store.set('me', 'grant');
    renderApp();
  }
  if (MODE !== 'artifact' && 'serviceWorker' in navigator && window.isSecureContext) {
    navigator.serviceWorker.register('sw.js', {scope:'./'}).catch(() => {});
  }
}
boot();
</script>
